name: secret_leak_via_llm
description: >
  Response to a detected secret/credential leak through an LLM response or
  tool output. Contain -> collect -> notify -> remediate.
steps:
  - name: contain
    action: revoke_jit_permissions
    params:
      note: "Revoke JIT grants for the session that produced the leak"
  - name: collect
    action: incident_timeline
    params:
      note: "Pull the audit timeline to identify what was leaked and to whom"
  - name: notify
    action: notify_security
    params:
      note: "Alert security; secret rotation is a human-action checklist item outside this tool's scope"
  - name: remediate
    action: export_incident_bundle
    params:
      note: "Export a signed bundle for the credential owner's rotation/audit trail"
    on_failure: continue
