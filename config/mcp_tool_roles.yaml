# config/mcp_tool_roles.yaml
# Per-call RBAC for the remote MCP transport (PROMPTWISE_TRANSPORT=http).
# Maps each MCP tool name to the minimum role required to call it
# remotely. Stdio/local calls never consult this file -- see
# core/tool_rbac.py and server.py's call_tool().
#
# Generated by a one-time naming-heuristic pass (prefixes get_/list_/
# query_/search_/check_/compare_ and suffixes _report/_stats/_status/
# _lookup -> viewer; everything else -> admin), with one manual
# override: get_admin_settings moved to admin despite the get_ prefix,
# since it exposes org-sensitive config (feature flags, budget limits).
# See docs/superpowers/specs/2026-09-01-mcp-per-call-rbac-design.md.
#
# Any tool NOT listed here (including every future tool added after
# this shipped) defaults to "admin" -- fail-closed, edit this file to
# grant a new tool viewer access explicitly.

